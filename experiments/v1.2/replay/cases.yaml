          research-orchestration/lib/pre-synthesis-guard.mjs、
          research-orchestration/lib/cross-group-aggregation.mjs、
          research-orchestration/lib/cross-source-synthesis.mjs；
          另一既有测试文件被更新（非新增，不计入 v1 信号）。合计 4 files, +755/-5；
          NEW_DIRECTORY = 0（lib/ 与 test/ 均已在 base 树中）。
    structure_disposition: NOT_ADJUDICATED
    structure_rationale: |
      语料不对此 diff 的结构面做裁决（既不是 AUTHORIZED_STRUCTURE，也不是结构违规）：
      结构层记录存在（票据 P1-T14 / Issue #46 及其契约提取），但候选时点为
      non-authoritative 且未获实施授权——票据图自述 AUTHORITY_CLASS =
      NON_AUTHORITATIVE_PLANNING_CANDIDATE、STATUS = REVIEW_PENDING、
