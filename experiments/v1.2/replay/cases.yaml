    structure_rationale: |
      语料不对此 diff 的结构面做裁决（既不是 AUTHORIZED_STRUCTURE，也不是结构违规）：
      结构层记录存在（票据 P1-T14 / Issue #46 及其契约提取），但候选时点为
      non-authoritative 且未获实施授权——票据图自述 AUTHORITY_CLASS =
