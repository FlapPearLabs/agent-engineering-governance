# experiments/v1.2/replay/cases.yaml — REAL HISTORICAL REPLAY CORPUS（非 canonical；2026-10-07 建立）
#
# 本文件是实验 V1.2 / 候选 H3（STRUCTURE_DELTA_SHADOW）的**证据准备**产物：
# 每个 case 从**公开来源仓库的真实 Git 历史**取出一个可定位的 BASE→CANDIDATE 变更对。
# 未来最小 shadow 原型（本轮不实现）可以按 provenance.resolver 的命令直接重建输入，
# 并与 expected_mechanical_signals / structure_disposition / behavioral_disposition 对照。
#
# 规则（与 seed corpus 同源，见 ../cases.yaml 头部）：
# - 禁止 synthetic reconstruction：CANDIDATE 必须能由 SHA 直接取出（git show），
#   不得按任何文字描述重新编写。
# - 三个事实轴互不替代、禁止合并（防状态坍缩）：
#     STRUCTURE_SIGNAL != STRUCTURE_VERDICT != CANDIDATE_CORRECTNESS
#   expected_mechanical_signals 只写机器可观察的结构事实；
#   structure_disposition ∈ {AUTHORIZED_STRUCTURE, NO_STRUCTURE_DELTA, NOT_ADJUDICATED}
#   与 behavioral_disposition ∈ {KNOWN_DEFECTIVE, POST_REVIEW_REPAIRS_REQUIRED,
#   NO_BEHAVIORAL_CLAIM} 是两个正交轴的独立裁决，各附 rationale（*_rationale），
#   不得合并成一个总括 verdict（授权结构 ≠ 候选无缺陷；行为缺陷 ≠ 结构违规）。
# - 找不到可解析证据的 seed 一律记入 not_replay_ready，不强行升级。
#
# class 取值（本文件局部语汇）：
#   POSITIVE_SEAM_DRIFT           真实历史中确认发生的 seam 漂移变更（含修复链证据）
#   NEGATIVE_AUTHORIZED_STRUCTURE 真实新增结构，但经授权/评审的正确变更
#   NEGATIVE_NO_STRUCTURE_DELTA   真实修复，无任何结构增量（噪声底对照）
#
# 结构信号语汇优先使用 ../evidence-lineage.md 第 3 节的既有类别
# （NEW_MODULE / NEW_DIRECTORY / NEW_PACKAGE / NEW_DEPENDENCY / NEW_PUBLIC_INTERFACE /
#  NEW_STATE_OWNER / NEW_PERSISTENCE_SURFACE / CROSS_BOUNDARY_DEPENDENCY）；
# 确需补充时只用纯事实名词，并保持 signal 字段可被机械 grep。
#
# 全部 SHA 与可达性于 2026-10-07 在对应仓库 clone 中核验；PR 类 provenance 另经 GitHub API 核验。
version: 1
