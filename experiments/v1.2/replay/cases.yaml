      已定位的缺陷证据只落在行为/合同层（见 behavioral 轴）。
      明确：新增文件（或任何结构信号）本身不证明 architecture violation——
      行为缺陷不得被反向投射为结构违规，结构面保持未裁决。
    behavioral_disposition: KNOWN_DEFECTIVE
    behavioral_rationale: |
      该 candidate 包含一个不成立的 seam 假设：cross-source-synthesis.mjs 以同步方式
      消费注入的 runtime seam（`runtimeResult = runtime.synthesize({...})`，无 await），
      且 T14 全部测试替身建模为同步 synthesize()。
      2026-09-10 生产 runtime 接线（4a6767f）后，真实集成在 T16 确定性失败
      （cfi_synthesis_failed；修复提交信息原文「surfaced as cfi_synthesis_failed
      at T16」）；PR #87（2026-09-13 落地为 9444a33）把 seam 统一为
      「Promise-returning, no Result|Promise union」并更新全部调用点与测试。
      机械信号（NEW_FILE ×3）不显示该缺陷——它只在行为/合同面可判定。
    provenance:
      resolver:
        repository: FlapPearLabs/zhihu-grabber-toolkit
        commands:
          - 'git rev-parse 4b6d182f1388e27ae33820feee1589cb0188d59b fa997c12e4c35fdb9267882747d2b55d13772ae2'
          - 'git diff 4b6d182f1388e27ae33820feee1589cb0188d59b fa997c12e4c35fdb9267882747d2b55d13772ae2 --stat'
          - 'git merge-base --is-ancestor fa997c12e4c35fdb9267882747d2b55d13772ae2 origin/master'
      index_refs:
        - experiments/v1.2/cases.yaml#c06-async-seam-mismatch-integration-blind
        - docs/design-history.md#H03（[Z03]）
      related_refs:
        - 'PR #87「fix(p1-t14): make synthesis runtime seam uniformly async」；head ref
          repair/p1-t14-async-runtime-contract；PR 合并落点 = GitHub API merge_commit_sha
          9444a33b3ca24a53f8da4b9e2cb03a241925f47f（单父落地形态）；合并于
          2026-09-13（经 GitHub API 核验）。'
        - '修复的 BASE：0d305b03c64f8b4f057415a29043aa41af082576（= 9444a33^）。'
        - '生产 runtime 接线：4a6767ff8b40c7bf2dbee2f220fc5194f553ede5（2026-09-10，
          新增 deepseek-research-runtime.mjs / p1-runtime-composer.mjs / research-p1.mjs）。'
        - '契约提取记录：0856be78ffbfa9e90497e1f1f1cba7fde7bc4b0d（2026-09-05，明示
          INTEGRATION_STATUS=NOT_YET_REAL_UPSTREAM，当时集成从未对真实上游发生）。'
      notes: |
        base 与 candidate 均为 origin/master 可达的真实提交；REPLAY_DIFF =
        git diff <base> <candidate>（非空）；direct-parent 等式 candidate^ == base 成立
