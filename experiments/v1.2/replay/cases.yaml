# experiments/v1.2/replay/cases.yaml — REAL HISTORICAL REPLAY CORPUS（非 canonical；2026-10-07 建立，2026-10-08 修订）
#
# 本文件是实验 V1.2 / 候选 H3（STRUCTURE_DELTA_SHADOW）的**证据准备**产物：
# 每个 case 从**公开来源仓库的真实 Git 历史**取出一个可定位的 BASE→CANDIDATE 变更对。
# 最小 shadow 原型（v0 已实现：见 ../structure_delta.py）可以按 provenance.resolver 的命令直接重建输入，
# 并与 expected_mechanical_signals / structure_disposition / behavioral_disposition 对照。
#
# 规则（与 seed corpus 同源，见 ../cases.yaml 头部）：
# - 禁止 synthetic reconstruction：CANDIDATE 必须能由 SHA 直接取出（git show），
#   不得按任何文字描述重新编写。
# - REPLAY_DIFF 唯一绑定：HISTORICAL_DIFF := git diff <base_sha> <candidate_sha>；
#   resolver 必须验证该对（两 SHA 存在 + diff 可解析且非空）。
#   STALE_OR_WRONG_BASE ⇒ provenance check FAIL。
#   candidate^ == base 的 direct-parent 等式为**逐案声明**（当前 5 案均成立），
#   不是普遍要求——未来 case 允许非 direct-parent 的 diff 对。
# - 三个事实轴互不替代、禁止合并（防状态坍缩）：
#     STRUCTURE_SIGNAL != STRUCTURE_VERDICT != CANDIDATE_CORRECTNESS
#   expected_mechanical_signals 只含 **v1 确定性信号**（NEW_FILE / NEW_DIRECTORY /
#   NEW_DEPENDENCY；PREDICATE 与 COUNTING_UNIT 见 replay/README.md 定义表）；
#   其余类别 = NOT_YET_MECHANICALLY_DEFINED，不进入 expected counts。
#   structure_disposition ∈ {AUTHORIZED_STRUCTURE, NO_STRUCTURE_DELTA, NOT_ADJUDICATED}：
#   AUTHORIZED_STRUCTURE 必须附 authority_ref（独立于 candidate 自述的公开、可解析
#   授权 artifact：approved spec / issue / ticket / authority record）；无法证明
#   ⇒ NOT_ADJUDICATED，且不得从 candidate commit message / 后续 review /
#   design-history 单独推导结构授权。
#   behavioral_disposition ∈ {KNOWN_DEFECTIVE, POST_REVIEW_REPAIRS_REQUIRED,
#   NO_BEHAVIORAL_CLAIM}；两轴各附 rationale（*_rationale）。
# - durability：ready case 必须默认分支可达；临时分支依赖 ⇒ 不入 ready
#   （记 not_replay_ready / NOT_DURABLE_REPLAY_READY）。
# - 找不到可解析证据的 seed 一律记入 not_replay_ready，不强行升级。
#
# class 取值（本文件局部语汇）：
#   POSITIVE_SEAM_DRIFT                真实历史中确认发生的 seam 漂移变更（含修复链证据）
#   NEGATIVE_AUTHORIZED_STRUCTURE      真实新增结构，且结构面有逐项授权记录（authority_ref）
#   NEGATIVE_STRUCTURE_NOT_ADJUDICATED 真实新增结构，但结构面无逐项授权记录（未裁决）
#   NEGATIVE_NO_STRUCTURE_DELTA        真实修复，无任何结构增量（噪声底对照）
#   H2_ADMISSION_CANDIDATE             2026-10-17 由 H2 Schema-v2 候选准入加入的真实历史对（r07–r30）：
#                                      只作 Schema-v2 身份锚；H3 两轴均未裁决，不计入 H3 正/负样本。
#                                      生成：h2-lazy-disclosure/admission/corpus_cases.py（信号计数独立于
#                                      H3 detector 计算，由 H3 loader 交叉核对）。
#
# 全部 SHA、REPLAY_DIFF 绑定与可达性于 2026-10-07 建立、2026-10-08 复核
# （对应仓库 clone + GitHub API）。
version: 1
