        「Promise-returning, no Result|Promise union」并更新全部调用点与测试。
        注意：机械信号（3 个新模块）本身不显示该缺陷——缺陷在 seam 语义与
        「测试替身 ≠ 生产形状」的落差；本 case 是「结构信号 ≠ 架构裁决」的正面材料。
