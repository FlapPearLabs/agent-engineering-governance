#
# The Schema-v2 identity anchors for Candidate Admission (r07-r33; r31-r33 are PR merges,
# replayed against their first parent). Same case format as
# experiments/v1.2/replay/cases.yaml (the H3 replay corpus), but a SEPARATE file: H3's loader
# reads every `cases:` entry of replay/cases.yaml as a detector case, so anchors appended there
# changed H3's metrics (fresh review of 4add2ca, finding 4). Nothing in H3 reads this file.
#
# Pinned twice, like the H3 corpus: H2_CORPUS_SHA256 in harness/check_task_class.py, and the
# per-case pair literal in experiments/v1.2/tests/test_v1_2_h2_eligibility_v2.py. A case id must
# not appear in both corpora (the validator refuses).
#
# Blocks are rendered by admission/corpus_cases.py from the batch case maps; their v1 signal
# counts are computed independently of the H3 detector and cross-checked against it by
# experiments/v1.2/tests/test_v1_2_h2_admission.py.
#
# class H2_ADMISSION_CANDIDATE: identity anchor only; no H3 structure or behaviour verdict.
