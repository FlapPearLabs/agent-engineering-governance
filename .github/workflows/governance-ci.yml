name: governance-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    name: validate-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin to the real candidate commit. On pull_request the default ref is
          # GitHub's synthetic merge commit (committer "GitHub <noreply@github.com>"),
          # which is not the commit whose metadata the public identity gate judges.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ---------------------------------------------------------------------
      # STATIC / MECHANICAL GATES
      # Policy: references/static-analysis-and-code-intelligence.md
      #   section 15 -- machine-provable failures are cleared BEFORE the
      #     expensive dynamic suites (static-first execution order).
      #   section 14 -- the toolchain is provisioned from the repository-pinned
      #     requirements file; a binary that happens to exist on the runner is
      #     NOT evidence that this gate is reproducible.
      #   section 9  -- a configured tool must actually run. REGISTERED IS NOT
      #     EXECUTED: the pinned dependency below only opens the gate because
      #     the two steps after it invoke it.
      # ---------------------------------------------------------------------
      - name: Provision pinned static toolchain
        run: python3 -m pip install -r requirements-dev.txt
      - name: Static gate - Python syntax / compile validation
        run: python3 -m compileall -q scripts adapters
      - name: Static gate - Ruff correctness lint (ruleset pinned in ruff.toml)
        run: python3 -m ruff check .
      - name: Run governance self-validation
        run: python3 scripts/validate_governance.py
      - name: Test governance documentation wiring checks
        run: python3 -m unittest discover -s scripts/tests
      - name: Run gate CLI entrypoint self-tests
        run: python3 -m unittest scripts.tests.test_p1_t16_gate_cli_entrypoint
      - name: Run PROJECT_CONTINUITY_CONTRACT synthetic matrix (PS1-20 / CG1-15 / R6 F1-F7 / R6.1 F1-F3)
        run: python3 -m unittest discover -s adapters/zcode/tests
      # The WorkBuddy adapter ships an executable guard, so its deny/allow matrix is a
      # gate, not documentation. REGISTERED != EXECUTED: a suite that exists but is not
      # invoked here would be silently NOT_RUN.
      - name: Run WorkBuddy adapter tests (git safety guard deny/allow matrix)
        run: python3 -m unittest discover -s adapters/workbuddy/tests
      - name: Run public-release current-tree scan
        env:
          PUBLIC_RELEASE: "1"
        run: python3 scripts/validate_public_release.py
      - name: Run public-release commit metadata gate
        env:
          PUBLIC_RELEASE: "1"
        run: python3 scripts/validate_public_release.py --commit-metadata
      - name: Run public-release policy self-tests
        env:
          PUBLIC_RELEASE: "1"
        run: python3 scripts/validate_public_release.py --selftest
