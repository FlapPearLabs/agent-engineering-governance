name: governance-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    name: validate-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run governance self-validation
        run: python3 scripts/validate_governance.py
      - name: Run PROJECT_CONTINUITY_CONTRACT synthetic matrix (PS1-15 / CG1-12)
        run: python3 -m unittest discover -s adapters/zcode/tests
